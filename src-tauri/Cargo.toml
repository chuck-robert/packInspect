[package]
name = "packinspect"
version = "0.1.0"
description = "本地包环境扫描工具"
authors = ["PackInspect"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 约定：核心逻辑放 lib，main.rs 只做入口，便于将来写集成测试
name = "packinspect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
